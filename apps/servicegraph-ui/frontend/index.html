<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Service Graph</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">SG</div>
          <div>
            <h1>Service Graph</h1>
            <div class="status-line">
              <span id="status-dot" class="status-dot"></span>
              <span id="status-label">Connecting</span>
            </div>
          </div>
        </div>
        <div class="header-stats" aria-label="Graph totals">
          <div><strong id="element-count">0</strong><span>Elements</span></div>
          <div><strong id="node-count">0</strong><span>Nodes</span></div>
          <div><strong id="edge-count">0</strong><span>Edges</span></div>
        </div>
      </header>

      <nav class="view-tabs" aria-label="Views">
        <button class="tab is-active" data-view="graph">Graph</button>
        <button class="tab" data-view="elements">Elements</button>
        <button class="tab" data-view="events">Events</button>
      </nav>

      <main>
        <section id="graph-view" class="view is-active">
          <div class="toolbar">
            <label class="search-field">
              <i data-lucide="search" aria-hidden="true"></i>
              <input id="graph-search" type="search" placeholder="Search graph" autocomplete="off" />
            </label>
            <select id="entity-filter" aria-label="Entity type">
              <option value="">All entity types</option>
            </select>
            <select id="edge-filter" aria-label="Relationship type">
              <option value="">All relationships</option>
            </select>
            <div class="toolbar-actions">
              <button id="fit-graph" class="icon-button" title="Fit graph" aria-label="Fit graph">
                <i data-lucide="maximize-2" aria-hidden="true"></i>
              </button>
              <button id="refresh-graph" class="icon-button" title="Refresh" aria-label="Refresh">
                <i data-lucide="refresh-cw" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="graph-workspace">
            <div id="graph-canvas"></div>
            <div id="graph-empty" class="empty-state" hidden>No active graph elements</div>
            <aside id="inspector" class="inspector" aria-live="polite">
              <div class="inspector-header">
                <div>
                  <span id="inspector-kind" class="eyebrow">Selection</span>
                  <h2 id="inspector-title">Graph overview</h2>
                </div>
                <button id="close-inspector" class="icon-button" title="Close inspector" aria-label="Close inspector">
                  <i data-lucide="x" aria-hidden="true"></i>
                </button>
              </div>
              <div id="inspector-body" class="inspector-body"></div>
            </aside>
          </div>
        </section>

        <section id="elements-view" class="view table-view">
          <div class="toolbar">
            <label class="search-field">
              <i data-lucide="search" aria-hidden="true"></i>
              <input id="element-search" type="search" placeholder="Search elements" autocomplete="off" />
            </label>
          </div>
          <div class="table-scroll"><table id="elements-table"></table></div>
        </section>

        <section id="events-view" class="view table-view">
          <div class="table-scroll"><table id="events-table"></table></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
