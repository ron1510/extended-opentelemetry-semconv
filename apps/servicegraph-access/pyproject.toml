[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servicegraph-access"
version = "0.3.0"
description = "Elasticsearch current-state projection for service graph elements."
requires-python = ">=3.12,<3.13"
dependencies = [
  "elasticsearch==8.15.1",
  "extended-opentelemetry-semconv>=0.1.0,<0.2.0",
  "fastapi==0.116.1",
  "kafka-python-ng==2.2.3",
  "opentelemetry-api==1.44.0",
  "pydantic-settings==2.14.2",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
servicegraph-access-init = "servicegraph_access.index:main"
servicegraph-access-projector = "servicegraph_access.projector:main"
servicegraph-access-api = "servicegraph_access.api:main"

[tool.setuptools.packages.find]
where = ["src"]
