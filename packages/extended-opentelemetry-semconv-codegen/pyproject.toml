[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extended-opentelemetry-semconv-codegen"
version = "0.2.0"
description = "Registry validation and deterministic code generation for extended OpenTelemetry semantic models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
]

[project.scripts]
extended-otel-semconv-codegen = "extended_otel_semconv_codegen:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
extended_otel_semconv_codegen = ["metadata/*.json"]
