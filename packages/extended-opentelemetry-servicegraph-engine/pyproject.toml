[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extended-opentelemetry-servicegraph-engine"
version = "0.1.0"
description = "Framework-independent service-graph lifecycle engine."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "extended-opentelemetry-semconv-models>=0.2.0,<0.3.0",
  "pydantic==2.13.4",
]

[tool.setuptools.packages.find]
where = ["src"]
