[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extended-opentelemetry-semconv-models"
version = "0.2.0"
description = "Generated OpenTelemetry-compatible semantic entity and relationship models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.13.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
extended_otel_semconv = ["metadata/service-graph-relationships.json"]
