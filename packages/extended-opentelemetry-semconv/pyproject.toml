[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extended-opentelemetry-semconv"
version = "0.4.0"
description = "Typed OpenTelemetry-compatible semantic entities, relationships, and graph access."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
gremlin = [
  "gremlinpython==3.8.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
extended_otel_semconv = ["metadata/*.json", "py.typed"]
