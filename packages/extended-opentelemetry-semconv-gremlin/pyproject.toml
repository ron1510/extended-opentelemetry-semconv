[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extended-opentelemetry-semconv-gremlin"
version = "0.1.0"
description = "Typed synchronous Gremlin client for extended OpenTelemetry semantic models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "extended-opentelemetry-semconv-models>=0.2.0,<0.3.0",
  "gremlinpython==3.8.1",
]

[tool.setuptools.packages.find]
where = ["src"]
