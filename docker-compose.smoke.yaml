services:
  interaction-diff:
    environment:
      INTERACTION_DIFF_TTL_SECONDS: "5"
      INTERACTION_DIFF_ALLOWED_LATENESS_SECONDS: "1"
      INTERACTION_DIFF_STATE_TTL_SECONDS: "60"
      FLINK_CHECKPOINT_INTERVAL_MS: "1000"

  demo-once:
    image: extended-otel-flink:2.2.1
    command: python -m extended_otel_semconv_devtools.telemetry.demo
    depends_on:
      otelcol:
        condition: service_healthy
      interaction-diff:
        condition: service_completed_successfully
    environment:
      OTLP_HTTP_ENDPOINT: http://otelcol:4318/v1/traces
      DEMO_ONCE: "true"
      DEMO_CLIENT_SERVICE: smoke-client
      DEMO_SERVER_SERVICE: smoke-server
    profiles: ["smoke"]
