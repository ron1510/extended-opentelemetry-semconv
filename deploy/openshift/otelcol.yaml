extensions:
  health_check:
    endpoint: localhost:13133
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    create_directory: true
    timeout: 10s
    compaction:
      on_start: true
      on_rebound: false
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch/traces:
    timeout: 1s
    send_batch_size: 256
  batch/servicegraph_metrics:
    timeout: 1s
    send_batch_size: 1
    send_batch_max_size: 1
connectors:
  service_graph:
    dimensions:
    - container.runtime.description
    - container.runtime.name
    - container.runtime.version
    - http.request.method
    - http.route
    - k8s.cluster.name
    - k8s.cluster.uid
    - k8s.container.name
    - k8s.container.restart_count
    - k8s.container.status.last_terminated_reason
    - k8s.cronjob.name
    - k8s.cronjob.uid
    - k8s.daemonset.name
    - k8s.daemonset.uid
    - k8s.deployment.name
    - k8s.deployment.uid
    - k8s.hpa.name
    - k8s.hpa.scaletargetref.api_version
    - k8s.hpa.scaletargetref.kind
    - k8s.hpa.scaletargetref.name
    - k8s.hpa.uid
    - k8s.job.name
    - k8s.job.uid
    - k8s.namespace.name
    - k8s.node.name
    - k8s.node.uid
    - k8s.persistentvolume.name
    - k8s.persistentvolume.reclaim_policy
    - k8s.persistentvolume.uid
    - k8s.persistentvolumeclaim.name
    - k8s.persistentvolumeclaim.uid
    - k8s.pod.hostname
    - k8s.pod.ip
    - k8s.pod.name
    - k8s.pod.start_time
    - k8s.pod.uid
    - k8s.replicaset.name
    - k8s.replicaset.uid
    - k8s.replicationcontroller.name
    - k8s.replicationcontroller.uid
    - k8s.resourcequota.name
    - k8s.resourcequota.uid
    - k8s.service.name
    - k8s.service.publish_not_ready_addresses
    - k8s.service.traffic_distribution
    - k8s.service.type
    - k8s.service.uid
    - k8s.statefulset.name
    - k8s.statefulset.uid
    - k8s.storageclass.name
    - process.args_count
    - process.command
    - process.command_line
    - process.creation.time
    - process.executable.build_id.gnu
    - process.executable.build_id.go
    - process.executable.build_id.htlhash
    - process.executable.name
    - process.executable.path
    - process.interactive
    - process.linux.cgroup
    - process.owner
    - process.parent_pid
    - process.pid
    - process.runtime.description
    - process.runtime.name
    - process.runtime.version
    - process.title
    - process.working_directory
    - service.criticality
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - telemetry.distro.name
    - telemetry.distro.version
    - telemetry.sdk.language
    - telemetry.sdk.name
    - telemetry.sdk.version
    - vcs.ref.head.name
    - vcs.ref.head.revision
    - vcs.ref.type
    - vcs.repository.name
    - vcs.repository.url.full
    virtual_node_peer_attributes: []
    database_name_attributes:
    - db.namespace
    - db.name
    store:
      ttl: 10s
      max_items: 10000
    metrics_flush_interval: 1s
exporters:
  kafka/servicegraph_metrics:
    brokers:
    - ${env:KAFKA_BOOTSTRAP_SERVERS}
    metrics:
      topic: ${env:INTERACTION_DIFF_INPUT_TOPIC}
      encoding: otlp_json
    tls:
      insecure: false
      insecure_skip_verify: false
      ca_file: /etc/kafka/tls/ca.crt
    auth:
      sasl:
        username: ${env:KAFKA_SASL_USERNAME}
        password: ${env:KAFKA_SASL_PASSWORD}
        mechanism: SCRAM-SHA-256
    producer:
      compression: gzip
      required_acks: -1
      allow_auto_topic_creation: false
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: items
      num_consumers: 4
      queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
service:
  extensions:
  - health_check
  - file_storage/queue
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - batch/traces
      exporters:
      - service_graph
    metrics/servicegraph:
      receivers:
      - service_graph
      processors:
      - memory_limiter
      - batch/servicegraph_metrics
      exporters:
      - kafka/servicegraph_metrics
