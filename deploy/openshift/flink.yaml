  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: servicegraph-flink
      app.kubernetes.io/component: taskmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: servicegraph-flink
        app.kubernetes.io/component: taskmanager
        app.kubernetes.io/part-of: extended-otel-semconv
        servicegraph.network/role: flink
    spec:
      serviceAccountName: servicegraph-flink
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: internal-registry-pull
      securityContext:
        runAsNonRoot: true
