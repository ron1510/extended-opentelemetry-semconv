nameOverride: ""
fullnameOverride: ""

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.156.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

router:
  replicaCount: 2
  service:
    type: ClusterIP
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi
  queueSize: 100000
  podAnnotations: {}

backend:
  # Version 1 intentionally fixes the hash ring at exactly two endpoints.
  replicaCount: 2
  serviceGraph:
    storeTtl: 10s
    storeMaxItems: 10000
    metricsFlushInterval: 5s
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  podAnnotations: {}

streamContract:
  version: "1.0"
  kafka:
    brokers:
      - kafka.example.internal:9093
    security:
      protocol: SASL_SSL
      saslMechanism: SCRAM-SHA-256
      existingSecret: servicegraph-kafka-auth
      usernameKey: username
      passwordKey: password
      caKey: ca.crt
  topics:
    servicegraphMetrics: otel.servicegraph.metrics
    interactionEvents: graph.interactions.events
    interactionDlq: graph.interactions.dlq

internalTls:
  enabled: false
  existingSecret: ""
  caKey: ca.crt
  certificateKey: tls.crt
  privateKeyKey: tls.key

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  routerIngress:
    namespaceSelector: {}
  kafkaEgress:
    cidrs: []
    ports:
      - 9093
  dnsEgress:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  metricsIngress:
    enabled: false
    namespaceSelector: {}

monitoring:
  service:
    enabled: true
    annotations: {}

topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}

test:
  enabled: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  image:
    repository: curlimages/curl
    tag: "8.13.0"
    pullPolicy: IfNotPresent
