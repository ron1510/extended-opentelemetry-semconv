{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "servicegraph-collector.fullname" . }}-router
  labels:
    {{- include "servicegraph-collector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "servicegraph-collector.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: router
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.routerIngress.namespaceSelector | nindent 12 }}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
    {{- if .Values.networkPolicy.metricsIngress.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.metricsIngress.namespaceSelector | nindent 12 }}
      ports:
        - {protocol: TCP, port: 8888}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "servicegraph-collector.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: servicegraph-backend
      ports:
        - {protocol: TCP, port: 4317}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dnsEgress.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dnsEgress.podSelector | nindent 12 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "servicegraph-collector.fullname" . }}-backend
  labels:
    {{- include "servicegraph-collector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "servicegraph-collector.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: servicegraph-backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "servicegraph-collector.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: router
      ports:
        - {protocol: TCP, port: 4317}
    {{- if .Values.networkPolicy.metricsIngress.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.metricsIngress.namespaceSelector | nindent 12 }}
      ports:
        - {protocol: TCP, port: 8888}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dnsEgress.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dnsEgress.podSelector | nindent 12 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- range .Values.networkPolicy.kafkaEgress.cidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        {{- range $.Values.networkPolicy.kafkaEgress.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
