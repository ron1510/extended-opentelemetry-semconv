apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "servicegraph-flink.fullname" . }}-launcher
  labels:
    {{- include "servicegraph-flink.labels" . | nindent 4 }}
    app.kubernetes.io/component: launcher
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "servicegraph-flink.labels" . | nindent 8 }}
        app.kubernetes.io/component: launcher
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "servicegraph-flink.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: launcher
          image: {{ .Values.image.ref | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              exec /opt/flink/bin/flink run --detached \
                --target kubernetes-application \
                --parallelism {{ .Values.application.parallelism }} \
                -Dkubernetes.cluster-id={{ .Values.application.clusterId }} \
                -Dkubernetes.namespace={{ .Release.Namespace }} \
                -Dkubernetes.container.image.ref={{ .Values.image.ref }} \
                -Dkubernetes.container.image.pull-policy={{ .Values.image.pullPolicy }} \
                -Dkubernetes.entry.path=/usr/bin/env \
                -Dkubernetes.service-account={{ include "servicegraph-flink.serviceAccountName" . }} \
                -Dkubernetes.jobmanager.replicas={{ .Values.application.jobManagerReplicas }} \
                -Dkubernetes.jobmanager.cpu={{ .Values.application.jobManagerCpu }} \
                -Dkubernetes.taskmanager.cpu={{ .Values.application.taskManagerCpu }} \
                -Dkubernetes.taskmanager.start-timeout={{ .Values.application.taskManagerStartTimeout }} \
                -Dkubernetes.pod-template-file.jobmanager=/opt/flink/pod-templates/jobmanager.yaml \
                -Dkubernetes.pod-template-file.taskmanager=/opt/flink/pod-templates/taskmanager.yaml \
                -Dhigh-availability.type=kubernetes \
                -Dhigh-availability.cluster-id={{ .Values.application.clusterId }} \
                -Dhigh-availability.storageDir=file:///flink-state/ha \
                -Dstate.backend.type=hashmap \
                -Dexecution.checkpointing.storage=filesystem \
                -Dexecution.checkpointing.dir=file:///flink-state/checkpoints \
                -Dexecution.checkpointing.savepoint-dir=file:///flink-state/savepoints \
                -Dexecution.checkpointing.externalized-checkpoint-retention=RETAIN_ON_CANCELLATION \
                -Dexecution.checkpointing.num-retained=2 \
                -Djobmanager.memory.process.size={{ .Values.application.jobManagerProcessMemory }} \
                -Dtaskmanager.memory.process.size={{ .Values.application.taskManagerProcessMemory }} \
                -Dtaskmanager.numberOfTaskSlots={{ .Values.application.taskManagerSlots }} \
                -Dpython.client.executable=/usr/local/bin/python \
                -Dpython.executable=/usr/local/bin/python \
                --pyModule otel_servicegraph_diff.cli \
                --pyFiles /opt/application
          resources:
            {{- toYaml .Values.resources.launcher | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pod-templates
              mountPath: /opt/flink/pod-templates
              readOnly: true
            - name: flink-state
              mountPath: /flink-state
            - name: flink-log
              mountPath: /opt/flink/log
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pod-templates
          configMap:
            name: {{ include "servicegraph-flink.fullname" . }}-pod-templates
        - name: flink-state
          persistentVolumeClaim:
            claimName: {{ include "servicegraph-flink.claimName" . }}
        - name: flink-log
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.emptyDir.tmpSizeLimit }}
