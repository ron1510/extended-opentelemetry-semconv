{{- if not .Values.elasticsearch.urls }}
{{- fail "elasticsearch.urls must contain at least one URL" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "servicegraph-access.fullname" . }}-api
  labels:
    {{- include "servicegraph-access.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "servicegraph-access.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "servicegraph-access.apiSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "servicegraph-access.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "servicegraph-access.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - servicegraph-access-api
          env:
            - name: SERVICEGRAPH_ACCESS_ELASTICSEARCH_URLS
              value: {{ join "," .Values.elasticsearch.urls | quote }}
            - name: SERVICEGRAPH_ACCESS_INDEX_NAME
              value: {{ .Values.elasticsearch.indexName | quote }}
            - name: SERVICEGRAPH_ACCESS_API_PORT
              value: {{ .Values.api.port | quote }}
            - name: SERVICEGRAPH_ACCESS_ELASTICSEARCH_PAGE_SIZE
              value: {{ .Values.api.elasticsearchPageSize | quote }}
            {{- with .Values.elasticsearch.auth.existingSecret }}
            - name: SERVICEGRAPH_ACCESS_ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.elasticsearch.auth.usernameKey | quote }}
            - name: SERVICEGRAPH_ACCESS_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.elasticsearch.auth.passwordKey | quote }}
            {{- end }}
            {{- with .Values.elasticsearch.tls.existingSecret }}
            - name: SERVICEGRAPH_ACCESS_ELASTICSEARCH_CA_FILE
              value: /etc/elasticsearch/tls/ca.crt
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 3
            failureThreshold: 100
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.elasticsearch.tls.existingSecret }}
            - name: elasticsearch-ca
              mountPath: /etc/elasticsearch/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.emptyDir.tmpSizeLimit }}
        {{- with .Values.elasticsearch.tls.existingSecret }}
        - name: elasticsearch-ca
          secret:
            secretName: {{ . | quote }}
            items:
              - key: {{ $.Values.elasticsearch.tls.caKey | quote }}
                path: ca.crt
        {{- end }}
