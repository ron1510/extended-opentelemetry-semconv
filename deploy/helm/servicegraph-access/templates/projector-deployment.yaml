{{- if not .Values.elasticsearch.urls }}
{{- fail "elasticsearch.urls must contain at least one URL" }}
{{- end }}
{{- if not .Values.streamContract.kafka.brokers }}
{{- fail "streamContract.kafka.brokers must contain at least one broker" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "servicegraph-access.fullname" . }}-projector
  labels:
    {{- include "servicegraph-access.labels" . | nindent 4 }}
    app.kubernetes.io/component: projector
spec:
  replicas: {{ .Values.projector.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "servicegraph-access.projectorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "servicegraph-access.projectorSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "servicegraph-access.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: projector
          image: {{ include "servicegraph-access.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - servicegraph-access-projector
          env:
            - name: SERVICEGRAPH_ACCESS_ELASTICSEARCH_URLS
              value: {{ join "," .Values.elasticsearch.urls | quote }}
            - name: SERVICEGRAPH_ACCESS_INDEX_NAME
              value: {{ .Values.elasticsearch.indexName | quote }}
            - name: SERVICEGRAPH_ACCESS_NUMBER_OF_SHARDS
              value: {{ .Values.elasticsearch.numberOfShards | quote }}
            - name: SERVICEGRAPH_ACCESS_NUMBER_OF_REPLICAS
              value: {{ .Values.elasticsearch.numberOfReplicas | quote }}
            - name: SERVICEGRAPH_ACCESS_REFRESH_INTERVAL
              value: {{ .Values.elasticsearch.refreshInterval | quote }}
            - name: SERVICEGRAPH_ACCESS_CONNECTION_DEADLINE_SECONDS
              value: {{ .Values.elasticsearch.connectionDeadlineSeconds | quote }}
            - name: SERVICEGRAPH_ACCESS_KAFKA_BOOTSTRAP_SERVERS
              value: {{ join "," .Values.streamContract.kafka.brokers | quote }}
            - name: SERVICEGRAPH_ACCESS_KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.streamContract.kafka.security.protocol | quote }}
            - name: SERVICEGRAPH_ACCESS_INPUT_TOPIC
              value: {{ .Values.streamContract.topics.interactionEvents | quote }}
            - name: SERVICEGRAPH_ACCESS_CONSUMER_GROUP_ID
              value: {{ .Values.projector.groupId | quote }}
            {{- with .Values.elasticsearch.auth.existingSecret }}
            - name: SERVICEGRAPH_ACCESS_ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.elasticsearch.auth.usernameKey | quote }}
            - name: SERVICEGRAPH_ACCESS_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.elasticsearch.auth.passwordKey | quote }}
            {{- end }}
            {{- with .Values.elasticsearch.tls.existingSecret }}
            - name: SERVICEGRAPH_ACCESS_ELASTICSEARCH_CA_FILE
              value: /etc/elasticsearch/tls/ca.crt
            {{- end }}
            {{- if ne .Values.streamContract.kafka.security.protocol "PLAINTEXT" }}
            - name: SERVICEGRAPH_ACCESS_KAFKA_SASL_MECHANISM
              value: {{ .Values.streamContract.kafka.security.saslMechanism | quote }}
            - name: SERVICEGRAPH_ACCESS_KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "streamContract.kafka.security.existingSecret is required for Kafka SASL" .Values.streamContract.kafka.security.existingSecret }}
                  key: {{ .Values.streamContract.kafka.security.usernameKey | quote }}
            - name: SERVICEGRAPH_ACCESS_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.streamContract.kafka.security.existingSecret | quote }}
                  key: {{ .Values.streamContract.kafka.security.passwordKey | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.elasticsearch.tls.existingSecret }}
            - name: elasticsearch-ca
              mountPath: /etc/elasticsearch/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.emptyDir.tmpSizeLimit }}
        {{- with .Values.elasticsearch.tls.existingSecret }}
        - name: elasticsearch-ca
          secret:
            secretName: {{ . | quote }}
            items:
              - key: {{ $.Values.elasticsearch.tls.caKey | quote }}
                path: ca.crt
        {{- end }}
