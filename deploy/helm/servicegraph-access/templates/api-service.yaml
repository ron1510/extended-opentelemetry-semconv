apiVersion: v1
kind: Service
metadata:
  name: {{ include "servicegraph-access.fullname" . }}-api
  labels:
    {{- include "servicegraph-access.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "servicegraph-access.apiSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
