apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "servicegraph-ui.fullname" . }}
  labels:
    {{- include "servicegraph-ui.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "servicegraph-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "servicegraph-ui.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: visualization
    spec:
      serviceAccountName: {{ include "servicegraph-ui.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: visualization
          image: {{ include "servicegraph-ui.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ join "," .Values.streamContract.kafka.brokers | quote }}
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.streamContract.kafka.security.protocol | quote }}
            - name: SERVICEGRAPH_UI_INPUT_TOPIC
              value: {{ .Values.streamContract.topics.interactionEvents | quote }}
            - name: SERVICEGRAPH_UI_GROUP_ID
              value: {{ .Values.consumer.groupId | quote }}
            - name: SERVICEGRAPH_UI_EVENT_LIMIT
              value: {{ .Values.consumer.recentEventLimit | quote }}
            - name: SERVICEGRAPH_UI_DATABASE_PATH
              value: /data/servicegraph.db
            {{- if eq .Values.streamContract.kafka.security.protocol "SASL_SSL" }}
            - name: KAFKA_SASL_MECHANISM
              value: {{ .Values.streamContract.kafka.security.saslMechanism | quote }}
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.streamContract.kafka.security.existingSecret }}
                  key: {{ .Values.streamContract.kafka.security.usernameKey }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.streamContract.kafka.security.existingSecret }}
                  key: {{ .Values.streamContract.kafka.security.passwordKey }}
            - name: KAFKA_SSL_CA_FILE
              value: /etc/kafka/tls/{{ .Values.streamContract.kafka.security.caKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.streamContract.kafka.security.protocol "SASL_SSL" }}
            - name: kafka-tls
              mountPath: /etc/kafka/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "servicegraph-ui.claimName" . }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.emptyDir.tmpSizeLimit }}
        {{- if eq .Values.streamContract.kafka.security.protocol "SASL_SSL" }}
        - name: kafka-tls
          secret:
            secretName: {{ required "streamContract.kafka.security.existingSecret is required for SASL_SSL" .Values.streamContract.kafka.security.existingSecret }}
            items:
              - key: {{ .Values.streamContract.kafka.security.caKey }}
                path: {{ .Values.streamContract.kafka.security.caKey }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
