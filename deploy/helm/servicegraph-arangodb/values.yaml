nameOverride: ""
fullnameOverride: ""

image:
  repository: arangodb
  tag: "3.12.9.4"
  pullPolicy: IfNotPresent

auth:
  existingSecret: ""
  passwordKey: root-password
  rootPassword: local-servicegraph-only

service:
  port: 8529

persistence:
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
