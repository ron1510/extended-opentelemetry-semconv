apiVersion: v1
kind: Namespace
metadata:
  name: servicegraph-system
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: servicegraph-system
spec:
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: servicegraph-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.3.5
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp=1
            - --memory=1G
            - --reserve-memory=0M
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda.servicegraph-system.svc:9092
          ports:
            - name: kafka
              containerPort: 9092
          readinessProbe:
            exec:
              command: [rpk, cluster, health]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1280Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-topics
  namespace: servicegraph-system
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: topics
          image: redpandadata/redpanda:v24.3.5
          command: [/bin/sh, -ec]
          args:
            - |
              until rpk topic list -X brokers=redpanda:9092; do sleep 2; done
              rpk topic create otel.servicegraph.metrics -X brokers=redpanda:9092 --partitions 3 || true
              rpk topic create graph.interactions.events -X brokers=redpanda:9092 --partitions 3 || true
              rpk topic create graph.interactions.dlq -X brokers=redpanda:9092 --partitions 3 || true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
