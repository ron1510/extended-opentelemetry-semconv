extensions:
  health_check:
    endpoint: localhost:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch/traces:
    timeout: 1s
    send_batch_size: 256
  batch/servicegraph_metrics:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512
connectors:
  service_graph:
    dimensions:
    - container.runtime.description
    - container.runtime.name
    - container.runtime.version
    - http.request.method
    - http.route
    - k8s.cluster.name
    - k8s.cluster.uid
    - k8s.container.name
    - k8s.container.restart_count
    - k8s.container.status.last_terminated_reason
    - k8s.cronjob.name
    - k8s.cronjob.uid
    - k8s.daemonset.name
    - k8s.daemonset.uid
    - k8s.deployment.name
    - k8s.deployment.uid
    - k8s.hpa.name
    - k8s.hpa.scaletargetref.api_version
    - k8s.hpa.scaletargetref.kind
    - k8s.hpa.scaletargetref.name
    - k8s.hpa.uid
    - k8s.job.name
    - k8s.job.uid
    - k8s.namespace.name
    - k8s.node.name
    - k8s.node.uid
    - k8s.persistentvolume.name
    - k8s.persistentvolume.reclaim_policy
    - k8s.persistentvolume.uid
    - k8s.persistentvolumeclaim.name
    - k8s.persistentvolumeclaim.uid
    - k8s.pod.hostname
    - k8s.pod.ip
    - k8s.pod.name
    - k8s.pod.start_time
    - k8s.pod.uid
    - k8s.replicaset.name
    - k8s.replicaset.uid
    - k8s.replicationcontroller.name
    - k8s.replicationcontroller.uid
    - k8s.resourcequota.name
    - k8s.resourcequota.uid
    - k8s.service.name
    - k8s.service.publish_not_ready_addresses
    - k8s.service.traffic_distribution
    - k8s.service.type
    - k8s.service.uid
    - k8s.statefulset.name
    - k8s.statefulset.uid
    - k8s.storageclass.name
    - process.args_count
    - process.command
    - process.command_line
    - process.creation.time
    - process.executable.build_id.gnu
    - process.executable.build_id.go
    - process.executable.build_id.htlhash
    - process.executable.name
    - process.executable.path
    - process.interactive
    - process.linux.cgroup
    - process.owner
    - process.parent_pid
    - process.pid
    - process.runtime.description
    - process.runtime.name
    - process.runtime.version
    - process.title
    - process.working_directory
    - service.criticality
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - telemetry.distro.name
    - telemetry.distro.version
    - telemetry.sdk.language
    - telemetry.sdk.name
    - telemetry.sdk.version
    - vcs.ref.head.name
    - vcs.ref.head.revision
    - vcs.ref.type
    - vcs.repository.name
    - vcs.repository.url.full
    virtual_node_peer_attributes: []
    database_name_attributes:
    - db.namespace
    - db.name
    store:
      ttl: 10s
      max_items: 10000
    metrics_flush_interval: 5s
exporters:
  kafka/servicegraph_metrics:
    brokers:
    - kafka:9092
    metrics:
      topic: otel.servicegraph.metrics
      encoding: otlp_json
    producer:
      compression: gzip
    sending_queue:
      enabled: true
      sizer: items
      queue_size: 100000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
service:
  extensions:
  - health_check
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - batch/traces
      exporters:
      - service_graph
    metrics/servicegraph:
      receivers:
      - service_graph
      processors:
      - memory_limiter
      - batch/servicegraph_metrics
      exporters:
      - kafka/servicegraph_metrics
  telemetry:
    metrics:
      level: detailed
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
