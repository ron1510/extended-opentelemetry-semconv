services:
  wheel-installer:
    build:
      context: .
      dockerfile: apps/otel-servicegraph-diff/Dockerfile
      target: runtime
    image: extended-otel-flink-runtime:2.2.1-java11
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        find /opt/application -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        python -m pip install --no-deps --no-compile \
          --target /opt/application \
          /wheels/extended_opentelemetry_semconv-*.whl \
          /wheels/otel_servicegraph_diff-*.whl
    volumes:
      - ./dist:/wheels:ro
      - flink-application:/opt/application
    restart: "no"

  flink-jobmanager:
    build:
      context: .
      dockerfile: apps/otel-servicegraph-diff/Dockerfile
      target: runtime
    image: extended-otel-flink-runtime:2.2.1-java11
    depends_on:
      wheel-installer:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /opt/application
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 3
        state.backend.type: hashmap
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
    volumes:
      - flink-application:/opt/application:ro
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints

  flink-taskmanager:
    image: extended-otel-flink-runtime:2.2.1-java11
    depends_on:
      wheel-installer:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/application
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 3
        taskmanager.memory.process.size: 1536m
        parallelism.default: 3
        state.backend.type: hashmap
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
    volumes:
      - flink-application:/opt/application:ro
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints

  interaction-diff:
    image: extended-otel-flink-runtime:2.2.1-java11
    depends_on:
      wheel-installer:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_healthy
    command:
      - flink
      - run
      - -d
      - -m
      - flink-jobmanager:8081
      - -py
      - /opt/application/otel_servicegraph_diff/cli.py
    environment:
      PYTHONPATH: /opt/application
    volumes:
      - flink-application:/opt/application:ro

  acceptance-tools:
    build:
      context: .
      dockerfile: apps/otel-servicegraph-diff/Dockerfile
      target: development
    image: extended-otel-flink-confidence:2.2.1-java11
    volumes:
      - ./reports/confidence:/reports
    profiles: ["acceptance"]

  demo-once:
    build:
      context: .
      dockerfile: apps/otel-servicegraph-diff/Dockerfile
      target: development
    image: extended-otel-flink-confidence:2.2.1-java11

volumes:
  flink-application:
