[dependency-groups]
dev = [
  "hypothesis==6.158.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "ruff==0.15.22",
]
docs = [
  "mkdocs-material==9.7.7",
]

[tool.pytest.ini_options]
pythonpath = [
  "packages/extended-opentelemetry-semconv/src",
  "apps/otel-servicegraph-diff/src",
  "apps/servicegraph-demo/src",
  "apps/servicegraph-ui/src",
]
testpaths = [
  "tests",
  "apps/otel-servicegraph-diff/tests",
  "apps/servicegraph-demo/tests",
  "apps/servicegraph-ui/tests",
]

[tool.ruff]
exclude = [
  ".pr-work",
  ".tmp",
  "packages/extended-opentelemetry-semconv/src/extended_otel_semconv/generated",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF043"]

[tool.ruff.lint.isort]
known-first-party = ["extended_otel_semconv", "otel_servicegraph_diff", "servicegraph_demo"]

[tool.pyright]
include = [
  "packages/extended-opentelemetry-semconv/src/extended_otel_semconv/graph/interaction.py",
  "packages/extended-opentelemetry-semconv/src/extended_otel_semconv/graph/metrics.py",
  "apps/otel-servicegraph-diff/src",
  "apps/otel-servicegraph-diff/tests",
  "apps/servicegraph-demo/src",
  "apps/servicegraph-demo/tests",
  "apps/servicegraph-ui/src",
  "apps/servicegraph-ui/tests",
]
extraPaths = [
  "packages/extended-opentelemetry-semconv/src",
  "apps/otel-servicegraph-diff/src",
  "apps/servicegraph-demo/src",
  "apps/servicegraph-ui/src",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
