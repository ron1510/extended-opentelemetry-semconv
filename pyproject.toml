[project]
name = "extended-opentelemetry-semconv"
version = "0.1.0"
description = "OpenTelemetry-compatible semantic entity registry extensions."
requires-python = ">=3.12,<3.13"
dependencies = [
  "apache-flink==2.2.1",
  "confluent-kafka==2.15.0",
  "opentelemetry-proto==1.44.0",
  "opentelemetry-semantic-conventions==0.64b0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyYAML==6.0.3",
]

[project.scripts]
extended-otel-interaction-diff = "extended_otel_semconv.services.interaction_diff.cli:main"
extended-otel-stress-telemetry = "extended_otel_semconv_devtools.telemetry.stress:main"
extended-otel-send-bad-kafka-metric = "extended_otel_semconv_devtools.telemetry.poison:main"

[dependency-groups]
dev = [
  "hypothesis==6.158.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = [".pr-work", ".tmp", "src/extended_otel_semconv/generated"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF043"]

[tool.pyright]
include = [
  "src/extended_otel_semconv/graph/interaction.py",
  "src/extended_otel_semconv/graph/metrics.py",
  "src/extended_otel_semconv/services/interaction_diff",
  "tests/test_interaction_config.py",
  "tests/test_interaction_diff.py",
  "tests/test_flink_operator.py",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
