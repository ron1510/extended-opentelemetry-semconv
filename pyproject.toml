[dependency-groups]
dev = [
  "confluent-kafka==2.15.0",
  "hypothesis==6.158.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[tool.pytest.ini_options]
pythonpath = [
  "packages/extended-opentelemetry-semconv/src",
  "apps/otel-servicegraph-diff/src",
  "tools",
]
testpaths = ["tests", "apps/otel-servicegraph-diff/tests"]

[tool.ruff]
exclude = [
  ".pr-work",
  ".tmp",
  "packages/extended-opentelemetry-semconv/src/extended_otel_semconv/generated",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF043"]

[tool.ruff.lint.isort]
known-first-party = ["extended_otel_semconv", "extended_otel_semconv_devtools", "otel_servicegraph_diff"]

[tool.pyright]
include = [
  "packages/extended-opentelemetry-semconv/src/extended_otel_semconv/graph/interaction.py",
  "packages/extended-opentelemetry-semconv/src/extended_otel_semconv/graph/metrics.py",
  "apps/otel-servicegraph-diff/src",
  "apps/otel-servicegraph-diff/tests",
  "tools/extended_otel_semconv_devtools/confidence",
]
extraPaths = [
  "packages/extended-opentelemetry-semconv/src",
  "apps/otel-servicegraph-diff/src",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
