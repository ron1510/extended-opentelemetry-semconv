[project]
name = "extended-opentelemetry-semconv"
version = "0.1.0"
description = "OpenTelemetry-compatible semantic entity registry extensions."
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.12.2",
  "opentelemetry-proto>=1.28.0",
  "psycopg[binary]>=3.3.2",
  "pydantic>=2.13.4",
  "PyYAML>=6.0.3",
  "SQLAlchemy>=2.0.45",
]

[project.scripts]
extended-otel-graph-loader = "extended_otel_semconv.services.graph_loader.cli:main"
extended-otel-stress-telemetry = "extended_otel_semconv_devtools.graph_loader.stress:main"
extended-otel-verify-stress-run = "extended_otel_semconv_devtools.graph_loader.verify:main"
extended-otel-send-bad-kafka-metric = "extended_otel_semconv_devtools.graph_loader.poison:main"

[dependency-groups]
dev = [
  "hypothesis>=6.155.7",
  "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = [".pr-work", ".tmp"]
