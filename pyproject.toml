[project]
name = "extended-opentelemetry-semconv"
version = "0.1.0"
description = "OpenTelemetry-compatible semantic entity registry extensions."
requires-python = ">=3.14"
dependencies = [
  "opentelemetry-semantic-conventions>=0.64b0",
  "pydantic>=2.13.4",
  "PyYAML>=6.0.3",
]

[dependency-groups]
dev = [
  "hypothesis>=6.155.7",
  "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
