[project]
name = "extended-opentelemetry-semconv"
version = "0.1.0"
description = "OpenTelemetry-compatible semantic entity registry extensions."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "opentelemetry-proto>=1.28.0",
  "pydantic>=2.13.4",
  "PyYAML>=6.0.3",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "hypothesis>=6.155.7",
  "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
