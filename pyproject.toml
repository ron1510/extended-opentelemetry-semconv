[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "extended-opentelemetry-semconv-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "hypothesis==6.158.0",
  "httpx==0.28.1",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
]
docs = [
  "mkdocs-material==9.7.7",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
markers = [
  "e2e: provisions a disposable Kubernetes environment and exercises the complete runtime",
  "elasticsearch: starts a disposable Elasticsearch container",
]
pythonpath = [
  "packages/extended-opentelemetry-semconv/src",
  "services/otel-servicegraph-diff/src",
  "services/servicegraph-demo/src",
  "services/servicegraph-access/src",
]
testpaths = [
  "packages/extended-opentelemetry-semconv/tests",
  "services/otel-servicegraph-diff/tests",
  "services/servicegraph-demo/tests",
  "services/servicegraph-access/tests",
  "tests/e2e",
]

[tool.coverage.run]
branch = true
omit = [
  "packages/extended-opentelemetry-semconv/src/extended_otel_semconv/generated/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
exclude = [
  ".pr-work",
  ".tmp",
  "packages/extended-opentelemetry-semconv/src/extended_otel_semconv/generated",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF043"]

[tool.ruff.lint.isort]
known-first-party = ["extended_otel_semconv", "otel_servicegraph_diff", "servicegraph_access", "servicegraph_demo"]

[tool.pyright]
include = [
  "packages/extended-opentelemetry-semconv/src/extended_otel_semconv/codegen.py",
  "packages/extended-opentelemetry-semconv/src/extended_otel_semconv/graph/interaction.py",
  "packages/extended-opentelemetry-semconv/src/extended_otel_semconv/graph/metrics.py",
  "services/otel-servicegraph-diff/src",
  "services/otel-servicegraph-diff/tests",
  "services/servicegraph-demo/src",
  "services/servicegraph-demo/tests",
  "services/servicegraph-access/src",
  "services/servicegraph-access/tests",
  "conftest.py",
  "tests/e2e",
  "packages/extended-opentelemetry-semconv/tests",
]
extraPaths = [
  "packages/extended-opentelemetry-semconv/src",
  "services/otel-servicegraph-diff/src",
  "services/servicegraph-demo/src",
  "services/servicegraph-access/src",
]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
