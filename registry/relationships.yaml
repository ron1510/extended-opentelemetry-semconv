{
  "registry_version": "0.1.0",
  "kind": "asset_relationship_registry",
  "stability": "development",
  "relationship_policy": {
    "edges_include_confidence_and_provenance": true,
    "placement_edges_point_from_runtime_entity_to_parent": true,
    "reverse_convenience_edges_may_be_materialized": true
  },
  "relationships": [
    {
      "type": "runs_on",
      "description": "Runtime placement on a compute parent.",
      "allowed_pairs": [
        ["k8s.pod", "k8s.node"],
        ["k8s.node", "compute.machine"],
        ["compute.vm", "compute.server"]
      ],
      "preferred_sources": ["kubernetes_state", "opentelemetry_trace", "host_cloud_metadata"]
    },
    {
      "type": "contains",
      "description": "Structural containment.",
      "allowed_pairs": [
        ["k8s.pod", "container.instance"],
        ["k8s.cluster", "k8s.node"],
        ["datacenter", "compute.server"]
      ],
      "preferred_sources": ["kubernetes_state", "inventory", "opentelemetry_trace"]
    },
    {
      "type": "member_of",
      "description": "Membership in a logical or administrative scope.",
      "allowed_pairs": [
        ["k8s.node", "k8s.cluster"],
        ["k8s.namespace", "k8s.cluster"],
        ["k8s.deployment", "k8s.namespace"],
        ["k8s.statefulset", "k8s.namespace"],
        ["k8s.replicaset", "k8s.namespace"]
      ],
      "preferred_sources": ["kubernetes_state", "opentelemetry_trace"]
    },
    {
      "type": "owned_by",
      "description": "Controller ownership or administrative authority.",
      "allowed_pairs": [
        ["k8s.pod", "k8s.replicaset"],
        ["k8s.pod", "k8s.statefulset"],
        ["k8s.replicaset", "k8s.deployment"]
      ],
      "preferred_sources": ["kubernetes_state"]
    },
    {
      "type": "manages",
      "description": "Reverse convenience edge for controller ownership queries.",
      "allowed_pairs": [
        ["k8s.deployment", "k8s.replicaset"],
        ["k8s.replicaset", "k8s.pod"],
        ["k8s.statefulset", "k8s.pod"]
      ],
      "preferred_sources": ["kubernetes_state"],
      "derived_from": "owned_by"
    },
    {
      "type": "implements",
      "description": "Runtime entity implements or backs a logical service.",
      "allowed_pairs": [
        ["k8s.deployment", "service.logical"],
        ["k8s.statefulset", "service.logical"],
        ["k8s.pod", "service.logical"],
        ["container.instance", "service.logical"]
      ],
      "preferred_sources": ["opentelemetry_trace", "kubernetes_state"]
    },
    {
      "type": "depends_on",
      "description": "Runtime dependency inferred from traces or service graph metrics.",
      "allowed_pairs": [
        ["service.logical", "service.logical"],
        ["k8s.deployment", "service.logical"],
        ["k8s.statefulset", "service.logical"]
      ],
      "preferred_sources": ["servicegraph_metrics", "opentelemetry_trace"]
    },
    {
      "type": "observed_by",
      "description": "Asset was observed by a telemetry or state source.",
      "allowed_pairs": [
        ["*", "telemetry.source"]
      ],
      "preferred_sources": ["opentelemetry_trace", "kubernetes_state", "host_cloud_metadata", "servicegraph_metrics"]
    },
    {
      "type": "alerts_on",
      "description": "Alert or metric contract targets an entity interface.",
      "allowed_pairs": [
        ["alert.contract", "*"]
      ],
      "preferred_sources": ["metric_alert_contract"]
    }
  ]
}
