        {"id": "container.name", "type": "string", "stability": "stable", "brief": "Container runtime name.", "examples": ["app"]},
        {"id": "container.image.name", "type": "string", "stability": "stable", "brief": "Container image name.", "examples": ["registry.example.com/checkout-api"]},
        {"id": "container.image.tag", "type": "string", "stability": "stable", "brief": "Container image tag.", "examples": ["1.8.3"]}
      ]
    }
  ]
}
