{
  "groups": [
    {
      "id": "registry.k8s",
      "type": "attribute_group",
      "display_name": "Kubernetes Entity Attributes",
      "brief": "Kubernetes attributes used by the entity interface POC.",
      "attributes": [
        {"id": "k8s.cluster.name", "type": "string", "stability": "stable", "brief": "The name of the Kubernetes cluster.", "examples": ["prod-us-east-1"]},
        {"id": "k8s.namespace.name", "type": "string", "stability": "stable", "brief": "The name of the Kubernetes namespace.", "examples": ["checkout"]},
        {"id": "k8s.node.name", "type": "string", "stability": "stable", "brief": "The name of the Kubernetes node.", "examples": ["ip-10-0-12-34.ec2.internal"]},
        {"id": "k8s.node.uid", "type": "string", "stability": "stable", "brief": "The UID of the Kubernetes node.", "examples": ["1eb3a0c6-0477-4080-a9cb-0cb7db65c6a2"]},
        {"id": "k8s.pod.uid", "type": "string", "stability": "stable", "brief": "The UID of the Kubernetes pod.", "examples": ["4e2b0bb9-4700-4f20-bb6f-c6e2b5975c6b"]},
        {"id": "k8s.pod.name", "type": "string", "stability": "stable", "brief": "The name of the Kubernetes pod.", "examples": ["checkout-api-7bc8c9c9cc-j62md"]},
        {"id": "k8s.container.name", "type": "string", "stability": "stable", "brief": "The name of the Kubernetes container from the pod specification.", "examples": ["app"]},
